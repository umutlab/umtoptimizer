name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# En az yetki: iş akışı depoya yazamaz, gizli bilgi kullanmaz.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Test + publish + setup
        shell: powershell
        run: .\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: UMToptimizer-Setup
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
